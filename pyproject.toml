[project]
name = "neuro"
version = "0.1.0"
description = "Medical image analysis for brain tumor segmentation on BraTS MRI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10,<3.13"
dependencies = [
  "torch",
  "torchvision",
  "monai>=1.3",
  "numpy",
  "h5py",
  "pandas",
  "pillow",
  "scikit-image",
  "matplotlib",
  "pyyaml",
  "tqdm",
  "fastapi",
  "uvicorn[standard]",
  "python-multipart",
  "pydantic>=2",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neuro"]

[tool.uv]
# Install torch/torchvision from PyTorch CPU index by default (no local GPU).
# On a CUDA machine: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121

[tool.ruff]
line-length = 100
target-version = "py312"
